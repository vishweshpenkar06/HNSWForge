services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: hnswforge-pgvector
    ports:
      - "55433:5432"
    environment:
      POSTGRES_DB: hnswforge
      POSTGRES_USER: hnswforge
      POSTGRES_PASSWORD: hnswforge
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hnswforge -d hnswforge"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgvector-data:
